<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/profile.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c1623" />
  <meta name="color-scheme" content="dark light" />

  <!--
    Resolve the theme before first paint: an explicit choice saved by the toggle wins,
    otherwise follow the OS setting. Keep the storage key and colours in sync with src/hooks/useTheme.ts.
  -->
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#f1faee" : "#0c1623");
    })();
  </script>

  <!-- Title, description, canonical, rel=me and social cards: generated from src/data/site.ts (vite.config.ts) -->
  <!-- seo:meta -->

  <!-- Structured data (ProfilePage, Person + services, projects, FAQ): generated from src/data -->
  <!-- seo:jsonld -->

  <!-- The hero portrait is the largest paint on first load; fetch it alongside the HTML -->
  <link rel="preload" as="image" href="/profile.webp" type="image/webp" fetchpriority="high" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@300;400;600;800&display=swap"
    rel="stylesheet">
  <style>
    /* Page background before the stylesheet arrives, so neither theme flashes the other */
    html { background-color: #0c1623; }
    html[data-theme="light"] { background-color: #f1faee; }

    /* The crawler copy of the page is visually hidden; React replaces it on mount */
    .seo-fallback {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
  <noscript>
    <style>
      /* Without JavaScript, show the content instead of an empty page */
      .seo-fallback { position: static; width: auto; height: auto; margin: 0 auto; padding: 2rem 1.25rem; max-width: 70ch; overflow: visible; clip: auto; white-space: normal; color: #f1faee; font-family: system-ui, sans-serif; line-height: 1.6; }
      .seo-fallback a { color: #a8dadc; }
    </style>
  </noscript>
</head>

<body style="margin: 0; padding: 0;">
  <div id="root">
    <!-- seo:content -->
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
